{% extends 'dashboard/faculty/base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Assign Unit to Lecturer</h3>
                </div>
                <div class="card-body">
                    {% include 'messages.html' %}
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Assign Unit</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
